<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>


<body class="flex justify-center items-center flex-col bg-gray-100">

    <header class="w-full">
        <section>
            <div class="w-full bg-white flex justify-between items-center px-[25px] py-[10px] shadow-sm">
                <h1 class="flex items-center text-xl font-bold">
                    <img class="w-auto h-[50px] hover:scale-110 transition duration-300" src="img/buslogo.png"
                        alt="un logo représentant un bus rapide">
                    BusDirect
                </h1>

                <div class="flex items-center gap-[20px]">
                    <img class="h-[30px] w-auto hover:scale-110 transition duration-300" src="img/tickets.svg"
                        alt="logo of tickets">

                    <a href="index.html">
                        <img class="w-auto h-[30px] hover:scale-110 transition duration-300"
                            src="img/market.svg" alt="logo of market">
                    </a>

                    <img class="h-[30px] hover:scale-110 transition duration-300"
                        src="img/profile.svg" alt="logo of log-in">
                </div>
            </div>
        </section>
    </header>

    <section class="flex items-center justify-between w-[85%] px-[25px] py-[20px] mt-[30px] mb-[30px] bg-white rounded-2xl shadow-sm">

        <div class="flex items-center gap-[15px]">
            <p class="text-xl font-semibold text-gray-800">
                Safi <span class="text-blue-600 mx-[5px]">→</span> Marrakech
            </p>

            <div class="rounded-lg bg-blue-100 px-[12px] py-[6px] text-blue-800 text-sm font-semibold">
                <p>80 DH / place</p>
            </div>
        </div>

        <div class="flex items-center gap-[10px]">
            <div class="flex items-center gap-[6px] bg-gray-100 px-[12px] py-[6px] rounded-full">
                <div class="w-[12px] h-[12px] bg-white border border-gray-300 rounded-sm"></div>
                <p class="text-sm text-gray-700">Libre</p>
            </div>

            <div class="flex items-center gap-[6px] bg-red-50 px-[12px] py-[6px] rounded-full">
                <div class="w-[12px] h-[12px] bg-red-200 border border-red-300 rounded-sm"></div>
                <p class="text-sm text-gray-700">Occupé</p>
            </div>
        </div>

    </section>

</body>


</html>
