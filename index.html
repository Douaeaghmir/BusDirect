
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

    <header class="flex items-center justify-between bg-white px-4 py-3 shadow-sm sm:px-6">
        <div class="flex items-center gap-2">
            <img src="img/buslogo.png" alt="Logo BusDirect" class="h-10 w-10 object-contain">
            <h1 class="text-xl font-bold text-blue-700">BusDirect</h1>
        </div>

        <nav class="flex gap-3 text-sm sm:gap-5">
            <a href="#" class="hover:text-blue-600">Accueil</a>
            <a href="#" class="hover:text-blue-600">Réservations</a>
        </nav>
    </header>
        <section class="mx-auto my-5 flex w-[95%] flex-col gap-4 rounded bg-white p-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h2 class="text-lg font-semibold">Safi → Marrakech</h2>
            <p class="mt-1 text-sm text-gray-500">Bus Direct · Voyage confortable</p>
        </div>

        <div class="flex flex-wrap gap-5 text-sm">
            <div>
                <p class="text-gray-500">Départ</p>
                <p class="font-medium">08:00</p>
            </div>

            <div>
                <p class="text-gray-500">Arrivée</p>
                <p class="font-medium">11:00</p>
            </div>

            <div>
                <p class="text-gray-500">Prix</p>
                <p class="font-medium">80 DH</p>
            </div>
        </div>
    </section>

</body>
</html>
